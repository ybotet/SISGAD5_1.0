[tool.poetry]
name = "prediction-service"
version = "1.0.0"
description = "SISGAD5 Prediction Service — Modelado predictivo y MLOps"
authors = ["Ing. Botet S.Y. <ybotet@etecsa.cu>"]
readme = "README.md"
packages = [{include = "app"}]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.115.0"
uvicorn = {version = "^0.30.0", extras = ["standard"]}
pydantic = "^2.9.0"
pydantic-settings = "^2.5.0"
scikit-learn = "^1.5.0"
xgboost = "^2.1.0"
prophet = "^1.1.6"
pandas = "^2.2.0"
numpy = "^1.26.0"
mlflow = "^2.14.0"
sqlalchemy = "^2.0.0"
httpx = "^0.27.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"
pytest-asyncio = "^0.24.0"
ruff = "^0.6.0"
mypy = "^1.11.0"

[tool.poetry.scripts]
server = "app.main:app"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.uvicorn]
host = "0.0.0.0"
port = 5005

[[tool.poetry.source]]
name = "aliyun"
url = "https://mirrors.aliyun.com/pypi/simple/"
priority = "primary"
