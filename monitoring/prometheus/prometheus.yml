global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "api-gateway"
    static_configs:
      - targets: ["api-gateway:5000"]

  - job_name: "backend-users"
    static_configs:
      - targets: ["backend-users:5001"]

  - job_name: "backend-mp"
    static_configs:
      - targets: ["backend-mp:5002"]

  - job_name: "backend-materiales"
    static_configs:
      - targets: ["backend-materiales:5003"]
