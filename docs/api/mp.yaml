openapi: 3.0.3
info:
  title: SISGAD5 - Mesa de Parte (MP) Service API
  description: 'Contrato al dia (v2.1.0) generado desde el codigo real de backend-mp

    (src/features/*/*.routes.js, montados bajo /api/mp). Refleja las 27 colecciones

    implementadas (CRUD + dashboards). Las rutas de la version anterior que no existen

    en el codigo fueron movidas a la seccion final PLANIFICADO (comentarios).


    Servicio: backend-mp (Node.js + Express + Sequelize) - Puerto 5002

    Base de datos: bd_sisgad5_mp (PostgreSQL)

    Prefijo via gateway: /api/mp/* (JWT obligatorio, verificado tambien en gateway)'
  version: 2.1.0
  contact:
    name: SISGAD5 Team
    url: https://github.com/ybotet/SISGAD5_1.0
servers:
- url: http://localhost:5000/api/mp
  description: API Gateway
- url: http://localhost:5002/api/mp
  description: Servicio directo (desarrollo)
security:
- bearerAuth: []
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    ApiResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: object
    Error:
      type: object
      properties:
        success:
          type: boolean
          example: false
        error:
          type: string
tags:
- name: Asignaciones
- name: Clasificacion
- name: Clientes
- name: Grupos W
- name: Movimientos
- name: Nomencladores
- name: Pizarras
- name: Pruebas
- name: Quejas
- name: Red externa
- name: Telefonia
- name: Trabajadores
- name: Trabajos
- name: Salud
paths:
  /asignacion:
    post:
      tags:
      - Asignaciones
      summary: Crea un nuevo registro.
      operationId: post_asignacion
      responses:
        '200':
          description: OK - envoltura {success,data}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '401':
          description: Token JWT ausente o invalido
        '403':
          description: 'Sin permiso: asignaciones.crear'
      description: 'Requiere permiso RBAC: asignaciones.crear'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
    get:
      tags:
      - Asignaciones
      summary: Listado del recurso con paginacion y filtros.
