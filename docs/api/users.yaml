openapi: 3.0.3
info:
  title: SISGAD5 - Users Service API
  description: |
    Contrato **al día** (v2.1.0) generado desde el código real de `backend-users`
    (`src/features/*/*.routes.js`, montados en `/api`). Incluye además la sección
    **"Planificado"** con endpoints aún no implementados.

    **Servicio:** backend-users (Node.js + Express + Sequelize) — Puerto 5001
    **Base de datos:** bd_sisgad5_users (PostgreSQL)
  version: 2.1.0
  contact:
    name: SISGAD5 Team
    url: https://github.com/ybotet/SISGAD5_1.0
servers:
  - url: http://localhost:5000/api
    description: API Gateway (namespace /api/users -> /api, /api/auth directo)
  - url: http://localhost:5001/api
    description: Servicio directo (desarrollo)
security:
  - bearerAuth: []
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    ApiResponse:
      type: object
      properties:
        success: {type: boolean}
        data: {type: object}
    Error:
      type: object
      properties:
        success: {type: boolean, example: false}
        error: {type: string}
paths:
  /auth/login:
    post:
      summary: Valida credenciales (bcrypt) y emite access token JWT + refresh token persistido.
      operationId: post_auth_login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object}
      responses:
        "200":
          description: OK — envoltura {success, data}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ApiResponse"}
        "400":
          description: Validación Joi fallida
        "401":
          description: No autenticado
  /auth/refresh:
    post:
      summary: Rota el refresh token y emite nuevos pares de tokens.
      operationId: post_auth_refresh
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object}
      responses:
        "201":
          description: OK — envoltura {success, data}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ApiResponse"}
        "400":
          description: Validación Joi fallida
        "401":
          description: No autenticado
  /auth/logout:
    post:
      summary: Revoca el refresh token proporcionado en BD.
      operationId: post_auth_logout
      security: []
      requestBody:
        required: true
        content:
