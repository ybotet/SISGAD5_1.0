openapi: 3.0.3
info:
  title: SISGAD5 - Materiales Service API (Go)
  description: 'Contrato al dia (v2.1.0) regenerado desde cmd/api/main.go del servicio Go.

    Refleja EXACTAMENTE las 34 rutas registradas + health. Version anterior documentaba

    /materiales/search, /saldos y /alertas-stock que no existen como endpoints (la busqueda

    y alertas se hacen via query params de GET /materiales y GET /dashboard/alertas).


    Servicio: backend-materiales-go (Go + Gorilla Mux + GORM) - Puerto 5003

    Base de datos: bd_sisgad5_materiales (PostgreSQL)

    Swagger generado por swag: disponible en /docs del propio servicio.'
  version: 2.1.0
  contact:
    name: SISGAD5 Team
    url: https://github.com/ybotet/SISGAD5_1.0
servers:
- url: http://localhost:5000/api/materiales
  description: API Gateway
- url: http://localhost:5003/api/materiales
  description: Servicio directo (desarrollo)
security:
- bearerAuth: []
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    ApiResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: object
tags:
- name: Materiales
- name: Asignaciones
- name: Consumos
- name: Dashboard
- name: Unidades de Medida
- name: Categorias
- name: Salud
