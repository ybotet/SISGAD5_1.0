        '401':
          description: JWT ausente o invalido (AuthMiddleware gorilla)
        '400':
          description: Payload invalido
        '409':
          description: Conflicto de negocio (p.ej. stock insuficiente)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
  /materiales/{id}:
