version: 1
projects:
  sisgad5-roadmap:
    name: "SISGAD5 Development Roadmap"
    description: >-
      Tablero de desarrollo de SISGAD5 con columnas:
      Backlog → In Progress → Review → Done
    columns:
      - name: "Backlog"
        description: "Tareas planificadas pero no iniciadas"
        color: "gray"
      - name: "In Progress"
        description: "Tareas en desarrollo activo"
        color: "blue"
      - name: "Review"
        description: "Tareas listas para revisión de código"
        color: "yellow"
      - name: "Done"
        description: "Tareas completadas"
        color: "green"
    automation:
      - event: "issue_opened"
        action: "add_to_column"
        column: "Backlog"
      - event: "issue_closed"
        action: "move_to_column"
        column: "Done"
      - event: "pull_request_opened"
        action: "add_to_column"
        column: "Review"
      - event: "pull_request_merged"
        action: "move_to_column"
        column: "Done"
    labels:
      - name: "🔴 Crítica (bloqueante)"
        color: "e11d21"
      - name: "🟡 Alta"
        color: "f29518"
      - name: "🟢 Media"
        color: "317846"
      - name: "⚪ Baja"
        color: "fef8c7"
      - name: "Documentación"
        color: "8799e9"
      - name: "Infraestructura"
        color: "0088cc"
      - name: "CI/CD"
        color: "5cb85c"
      - name: "Monitoreo"
        color: "7eb800"
      - name: "Testing"
        color: "a878ab"
      - name: "Users Service"
        color: "006b75"
      - name: "MP Service"
        color: "f29518"
      - name: "Materials Service"
        color: "0052cc"
      - name: "Frontend"
        color: "5319e7"
      - name: "API Gateway"
        color: "0082cc"
