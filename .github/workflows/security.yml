name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  audit-js:
    name: npm audit (JS)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [api-gateway, backend-users, backend-mp, frontend]
    defaults:
      run:
        working-directory: ${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit
        run: npm audit --audit-level=moderate

  audit-go:
    name: govulncheck (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend-materiales-go
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run govulncheck
        run: govulncheck -severity=high ./... || true

  secrets-scan:
    name: Secrets Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Gitleaks scan
        uses: gitleaks/gitleaks-action@v2
        with:
          config-file: .gitleaks.toml
          report-format: sarif
          output: gitleaks-report.sarif

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: gitleaks-report.sarif

  dependency-check:
    name: Dependency Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Checkout all services
        run: |
          mkdir -p /tmp/services
          for svc in api-gateway backend-users backend-mp frontend; do
            mkdir -p /tmp/services/$svc
            cp -r $svc/package.json $svc/package-lock.json /tmp/services/$svc/ 2>/dev/null || true
          done

      - name: Run Dependency Check
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: 'SISGAD5'
          path: '.'
          format: 'SARIF'
          out: 'reports'

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'reports/Dependency-Check-SARIF.sarif'
