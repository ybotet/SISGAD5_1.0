version: "3.8"

services:
  postgres:
    image: postgres:17-alpine
    container_name: sisgad5-postgres
    environment:
      POSTGRES_DB: sisgad5-users
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backup:/docker-entrypoint-initdb.d
    networks:
      - sisgad5-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  backend-users:
    build: ./backend-users
    container_name: sisgad5-users
    ports:
      - "5001:5001"
    environment:
      - NODE_ENV=development
      - PORT=5001
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=${USERS_DB_NAME}
      - DB_USER=postgres
      - DB_PASSWORD=${DB_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
      - FRONTEND_URL=${FRONTEND_URL}
    volumes:
      - ./backend-users:/app
      - /app/node_modules
      - ./logs/backend-users:/app/logs # Para logs
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - sisgad5-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  backend-mp:
    build: ./backend-mp
    container_name: sisgad5-mp
    ports:
      - "5002:5002"
    environment:
      - NODE_ENV=development
      - PORT=5002
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=${MP_DB_NAME}
      - DB_USER=postgres
      - DB_PASSWORD=${DB_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
      - USERS_SERVICE_URL=http://backend-users:5001
      - FRONTEND_URL=${FRONTEND_URL}
    volumes:
      - ./backend-mp:/app
      - /app/node_modules
      - ./logs/backend-mp:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - sisgad5-network

  backend-materiales:
    build: ./backend-materiales-go
    container_name: sisgad5-materiales
    depends_on:
      postgres:
        condition: service_healthy
    env_file: .env
    environment:
      - PORT=5003
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=${MATERIALES_DB_NAME}
      - DB_USER=postgres
      - DB_PASSWORD=${DB_PASSWORD}
      - FRONTEND_URL=${FRONTEND_URL}
    ports:
      - "5003:5003"
    volumes:
      - ./logs/backend-materiales:/app/logs
    restart: unless-stopped
    networks:
      - sisgad5-network

  api-gateway:
    build: ./api-gateway
    container_name: sisgad5-gateway
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=development
      - PORT=5000
      - USERS_SERVICE_URL=http://backend-users:5001
      - MP_SERVICE_URL=http://backend-mp:5002
      - FRONTEND_URL=${FRONTEND_URL}
    volumes:
      - ./api-gateway:/app
      - /app/node_modules
      - ./logs/api-gateway:/app/logs # ← Tus logs del gateway aquí
    depends_on:
      - backend-users
      - backend-mp
    networks:
      - sisgad5-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    build: ./frontend
    container_name: sisgad5-frontend
    ports:
      - "5004:5004"
    environment:
      - NODE_ENV=development
      - VITE_API_URL=http://localhost:5000/api
      - VITE_FRONT_URL=http://localhost:5004
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - api-gateway
    networks:
      - sisgad5-network

  # ============ STACK DE MONITOREO ============
  loki:
    image: grafana/loki:2.9.2
    container_name: sisgad5-loki
    ports:
      - "3100:3100"
    volumes:
      - ./monitoring/loki-config.yaml:/etc/loki/loki-config.yaml
      - loki-data:/loki
    command: -config.file=/etc/loki/loki-config.yaml
    networks:
      - sisgad5-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M

  promtail:
    image: grafana/promtail:2.9.2
    container_name: sisgad5-promtail
    volumes:
      # Monta los logs de todos tus servicios
      - ./logs:/var/log/apps:ro
      - /var/lib/docker/containers:/var/log/containers:ro # Logs de contenedores
      - ./monitoring/promtail-config.yaml:/etc/promtail/promtail-config.yaml
    command: -config.file=/etc/promtail/promtail-config.yaml
    networks:
      - sisgad5-network
    restart: unless-stopped
    depends_on:
      - loki
    deploy:
      resources:
        limits:
          memory: 128M

  grafana:
    image: grafana/grafana:10.2.0
    container_name: sisgad5-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_SECURITY_ADMIN_USER=admin
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana-provisioning:/etc/grafana/provisioning
    networks:
      - sisgad5-network
    restart: unless-stopped
    depends_on:
      - loki
    deploy:
      resources:
        limits:
          memory: 256M

volumes:
  postgres_data:
  loki-data:
  grafana-data:

networks:
  sisgad5-network:
    driver: bridge
